name: Publish Package to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Critical permission required to request the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24 or later)
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Node v22.14.0+ is required for trusted publishing
          # DO NOT add registry-url or always-auth flags here, as they conflict with OIDC

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build --if-present

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: "" # Clears setup-node's default fallback token if present
